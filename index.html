<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cek Nilai UTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#2740d9;
  --card:#ffffff;
  --ink:#16193a;
  --muted:#5d6286;
  --line:#dfe2f5;
  --accent:#ffd84d;
  --accent-ink:#16193a;
  --field:#f4f5fd;
  --bad:#e5484d;   --bad-bg:#fdecec;
  --mid:#d98a00;   --mid-bg:#fff4d6;
  --good:#12a05c;  --good-bg:#e3f7ec;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141a52; --card:#1d2263; --ink:#f1f2ff; --muted:#aab0e6; --line:#323a8c;
    --field:#161b55; --bad-bg:#4a1f3a; --mid-bg:#4a3d17; --good-bg:#15423a;
  }
}
:root[data-theme="dark"]{
  --bg:#141a52; --card:#1d2263; --ink:#f1f2ff; --muted:#aab0e6; --line:#323a8c;
  --field:#161b55; --bad-bg:#4a1f3a; --mid-bg:#4a3d17; --good-bg:#15423a;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--body);
  font-size:16px;
  line-height:1.5;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.shell{width:100%;max-width:420px}
.brand{
  font-family:var(--display);
  font-weight:800;
  color:#fff;
  font-size:2.6rem;
  line-height:1.02;
  letter-spacing:-.02em;
  margin:0 0 6px;
}
.brand span{background:var(--accent);color:var(--accent-ink);padding:0 .22em;border-radius:.18em;display:inline-block;transform:rotate(-2deg)}
.sub{color:#dfe4ff;margin:0 0 22px}
.card{
  background:var(--card);
  border-radius:22px;
  padding:26px 22px;
  box-shadow:0 18px 40px -18px rgba(5,10,60,.6);
}
h2{font-family:var(--display);font-size:1.5rem;margin:0 0 4px;letter-spacing:-.01em}
.hint{color:var(--muted);margin:0 0 18px;font-size:.95rem}
label{display:block;font-weight:700;font-size:.92rem;margin-bottom:6px}
input{
  width:100%;
  font:inherit;
  font-size:1.1rem;
  font-weight:500;
  color:var(--ink);
  background:var(--field);
  border:2px solid var(--line);
  border-radius:14px;
  padding:14px 16px;
  letter-spacing:.04em;
}
input:focus{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--ink)}
.btn{
  font:inherit;
  font-weight:700;
  cursor:pointer;
  border:0;
  border-radius:14px;
  padding:14px 18px;
  background:var(--accent);
  color:var(--accent-ink);
  width:100%;
  margin-top:14px;
  font-size:1.02rem;
}
.btn:hover{filter:brightness(.96)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.mapel:focus-visible,.link:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.err{
  margin:12px 0 0;
  padding:10px 12px;
  border-radius:12px;
  background:var(--bad-bg);
  color:var(--bad);
  font-weight:500;
  font-size:.94rem;
}
[hidden]{display:none!important}
.who{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:18px}
.who .nm{font-family:var(--display);font-weight:700;font-size:1.3rem;line-height:1.15}
.who .kd{color:var(--muted);font-size:.9rem}
.link{
  background:none;border:0;font:inherit;font-weight:700;color:var(--muted);
  cursor:pointer;padding:4px 2px;text-decoration:underline;text-underline-offset:3px;white-space:nowrap
}
.mapel-grid{display:grid;gap:12px}
.mapel{
  font:inherit;
  cursor:pointer;
  display:flex;align-items:center;gap:16px;
  text-align:left;
  background:var(--field);
  color:var(--ink);
  border:2px solid var(--line);
  border-radius:18px;
  padding:16px;
}
.mapel:hover{border-color:var(--ink)}
.mapel .ic{
  flex:none;width:58px;height:58px;border-radius:16px;
  display:grid;place-items:center;
  background:var(--accent);color:var(--accent-ink);
}
.mapel:nth-child(2) .ic{background:#7cf0c1}
.mapel[data-key="uiux"] .ic{background:#b9c4ff}
.mapel[disabled]{opacity:.6;cursor:not-allowed;border-style:dashed}
.mapel[disabled]:hover{border-color:var(--line)}
.mapel[disabled] .ic{background:var(--line);color:var(--muted)}
.badge{display:inline-block;margin-top:6px;padding:2px 10px;border-radius:999px;font-size:.82rem;font-weight:700}
.b-done{background:var(--good-bg);color:var(--good)}
.b-wait{background:var(--mid-bg);color:var(--mid)}
.mapel .t{font-family:var(--display);font-weight:700;font-size:1.2rem;line-height:1.1}
.score-wrap{text-align:center;padding:8px 0 4px}
.mp-name{font-weight:700;color:var(--muted);margin:0 0 4px}
.score{
  font-family:var(--display);
  font-weight:800;
  font-size:6.5rem;
  line-height:1;
  letter-spacing:-.04em;
  margin:0;
}
.msg{
  display:inline-block;
  margin-top:14px;
  padding:10px 18px;
  border-radius:14px;
  font-family:var(--display);
  font-weight:800;
  font-size:1.4rem;
}
.s-bad .score{color:var(--bad)}   .s-bad .msg{background:var(--bad-bg);color:var(--bad)}
.s-mid .score{color:var(--mid)}   .s-mid .msg{background:var(--mid-bg);color:var(--mid)}
.s-good .score{color:var(--good)} .s-good .msg{background:var(--good-bg);color:var(--good)}
.s-none .score{color:var(--muted);font-size:3rem}
.s-none .msg{background:var(--field);color:var(--muted);font-size:1.05rem;font-weight:700}
.pop{animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:12px 20px;border-radius:14px;font-weight:700;z-index:30;max-width:calc(100% - 40px);text-align:center;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
.count{font-family:var(--display);font-weight:800;font-size:6.5rem;line-height:1;color:var(--ink);margin:6px 0 4px}
.count.tick{animation:beat .9s ease-out}
@keyframes beat{0%{transform:scale(1.7);opacity:0}25%{opacity:1}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.count.tick{animation:none}}

.spin{width:56px;height:56px;border-radius:50%;border:6px solid var(--line);border-top-color:var(--ink);margin:4px auto 16px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.dlg .q.sm{font-size:1.35rem}
.dlg .q.md{font-size:1.5rem}
#oq{margin-bottom:16px}
.dlg .q.prank{font-size:3.6rem;letter-spacing:.03em;display:inline-block;background:var(--accent);color:var(--accent-ink);padding:2px 18px;border-radius:14px;transform:rotate(-3deg);animation:wobble .5s ease-in-out infinite alternate}
@keyframes wobble{from{transform:rotate(-5deg) scale(1)}to{transform:rotate(3deg) scale(1.08)}}
@media (prefers-reduced-motion:reduce){.dlg .q.prank{animation:none}}
.foot{color:#c4ccff;text-align:center;font-size:.85rem;margin-top:16px}

/* KONFIRMASI */
.ov{position:fixed;inset:0;background:rgba(8,12,50,.65);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.dlg{background:var(--card);color:var(--ink);border-radius:22px;padding:26px 22px 20px;width:100%;max-width:360px;text-align:center;box-shadow:0 24px 50px -16px rgba(5,10,60,.7)}
.dlg .emo{font-size:2.6rem;line-height:1;margin-bottom:8px}
.dlg .q{font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1.15;letter-spacing:-.01em;margin:0 0 6px}
.dlg .mp{color:var(--muted);font-size:.92rem;margin:0 0 16px}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:16px}
.dots i{width:22px;height:6px;border-radius:99px;background:var(--line)}
.dots i.on{background:var(--ink)}
.dlg .row{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.dlg .btn{margin-top:0}
.btn.ghost{background:var(--field);color:var(--ink);border:2px solid var(--line)}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
</style>
</head>
<body>
<div class="shell">
  <h1 class="brand">Cek Nilai <span>UTS</span></h1>
  <p class="sub">Kelas X DKV</p>

  <!-- LOGIN -->
  <section class="card" id="vLogin">
    <h2>Masuk</h2>
    <p class="hint">Masukkan username yang kamu isi di form.</p>
    <label for="kode">Username</label>
    <input id="kode" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="username kamu" inputmode="text">
    <p class="err" id="err" role="alert" hidden></p>
    <button class="btn" id="btnLogin" type="button">Masuk</button>
  </section>

  <!-- PILIH MAPEL -->
  <section class="card" id="vMenu" hidden>
    <div class="who">
      <div>
        <div class="nm" id="nm"></div>
        <div class="kd" id="kd"></div>
      </div>
      <button class="link" id="btnKeluar1" type="button">Keluar</button>
    </div>
    <h2>Pilih mapel</h2>
    <p class="hint">Tap mapel yang sudah dinilai buat lihat nilai UTS kamu.</p>
    <div class="mapel-grid">
      <button class="mapel" type="button" data-key="dkgv" data-tk="X" disabled aria-disabled="true">
        <span class="ic" aria-hidden="true">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.4 0 2-.9 2-1.8 0-1.2-.9-1.5-.9-2.6 0-1 .8-1.6 1.8-1.6H17a4 4 0 0 0 4-4C21 6.8 17 3 12 3z"/><circle cx="7.5" cy="11" r="1" fill="currentColor"/><circle cx="10.5" cy="7.5" r="1" fill="currentColor"/><circle cx="15" cy="7.5" r="1" fill="currentColor"/></svg>
        </span>
        <span><span class="t" style="display:block">Desain Komputer Grafis dan Visual</span><span class="badge b-wait">Belom Dinilai</span></span>
      </button>
      <button class="mapel" type="button" data-key="koding" data-tk="X">
        <span class="ic" aria-hidden="true">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7l-5 5 5 5"/><path d="M16 7l5 5-5 5"/><path d="M14 4l-4 16"/></svg>
        </span>
        <span><span class="t" style="display:block">Koding dan Kecerdasan Artifisial</span><span class="badge b-done">Sudah Dinilai</span></span>
      </button>
      <button class="mapel" type="button" data-key="uiux" data-tk="XI" hidden>
        <span class="ic" aria-hidden="true">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2.5"/><path d="M3 9h18"/><path d="M9 9v12"/><path d="M13 14h5"/><path d="M13 17.5h3"/></svg>
        </span>
        <span><span class="t" style="display:block">KK-WEB Desain UI/UX With FIGMA</span><span class="badge b-done">Sudah Dinilai</span></span>
      </button>
    </div>
  </section>

  <!-- HASIL NILAI -->
  <section class="card" id="vHasil" hidden>
    <div class="who">
      <div>
        <div class="nm" id="nm2"></div>
        <div class="kd" id="kd2"></div>
      </div>
      <button class="link" id="btnKeluar2" type="button">Keluar</button>
    </div>
    <div class="score-wrap" id="scoreWrap">
      <p class="mp-name" id="mpName"></p>
      <p class="score" id="score"></p>
      <div class="msg" id="msg"></div>
    </div>
    <button class="btn" id="btnBack" type="button">Lihat mapel lain</button>
  </section>

  <p class="foot">Nilai tidak sesuai? Hubungi guru mapel.</p>
</div>

<div class="ov" id="ov" hidden>
  <div class="dlg" id="dlg" role="dialog" aria-modal="true" aria-labelledby="cq">
    <div class="emo" id="cemo" aria-hidden="true"></div>
    <p class="q" id="cq"></p>
    <p class="mp" id="cmp"></p>
    <div class="dots" id="cdots" aria-hidden="true"></div>
    <div class="row">
      <button class="btn ghost" id="cNo" type="button">Gak jadi</button>
      <button class="btn" id="cYes" type="button">Iya</button>
    </div>
  </div>
</div>
<div class="ov" id="ov2" hidden>
  <div class="dlg" role="alertdialog" aria-live="assertive" aria-labelledby="fText">
    <div class="emo" id="fEmo" aria-hidden="true">😒</div>
    <p class="q" id="fText"></p>
    <div class="count" id="fCount" hidden></div>
  </div>
</div>
<div class="ov" id="ov4" hidden>
  <div class="dlg" role="alertdialog" aria-modal="true" aria-labelledby="oq">
    <div class="emo" aria-hidden="true">🥺</div>
    <p class="q" id="oq">Beneran mau keluar?</p>
    <div class="row">
      <button class="btn ghost" id="oNo" type="button">Gak jadi</button>
      <button class="btn" id="oYes" type="button">Iya, keluar</button>
    </div>
  </div>
</div>
<div class="ov" id="ov3" hidden>
  <div class="dlg" role="status" aria-live="polite">
    <div class="spin" id="spin" aria-hidden="true"></div>
    <div class="emo" id="lEmo" aria-hidden="true" hidden>🎉</div>
    <p class="q sm" id="lText">Mengecek username...</p>
  </div>
</div>

    var first = lines[0];
    var delim = first.indexOf("\t") > -1 ? "\t" : (first.split(";").length > first.split(",").length ? ";" : ",");
    var head = lines[0].split(delim).map(function(h){ return h.trim().toLowerCase(); });
    var db = {};
    for(var i=1;i<lines.length;i++){
      var c = lines[i].split(delim);
      var row = {};
      head.forEach(function(h,idx){ row[h] = (c[idx] || "").trim(); });
      var k = norm(row.kode);
      if(!k) continue;
      db[k] = {
        kode: row.kode,
        nama: row.nama || "",
        kelas: row.kelas || "",
        tingkat: /^XI\s/i.test(row.kelas || "") ? "XI" : "X",
        dkgv: toNum(row.dkgv),
        koding: toNum(row.koding),
        uiux: toNum(row.uiux)
      };
    }
    return db;
  }
  function toNum(v){
    if(v === undefined || v === null || String(v).trim() === "") return null;
    var n = parseFloat(String(v).replace(",", "."));
    return isNaN(n) ? null : n;
  }
  function norm(s){ return String(s || "").trim().toUpperCase().replace(/\s+/g, ""); }

  var DB = parseCSV(CSV_DATA);
  var MAPEL = { dkgv: "Desain Komputer Grafis dan Visual", koding: "Koding dan Kecerdasan Artifisial", uiux: "KK-WEB Desain UI/UX With FIGMA" };
  var current = null;

  function show(id){
    ["vLogin","vMenu","vHasil"].forEach(function(v){ $(v).hidden = (v !== id); });
  }

  function normUser(s){ return String(s || "").normalize("NFKC").trim().toLowerCase().replace(/\s+/g, " "); }
  var logging = false;
  function bukaDenganEfek(){
    if(logging) return;
    logging = true;
    var ov = $("ov3"), spin = $("spin"), emo = $("lEmo"), txt = $("lText");
    spin.hidden = false; emo.hidden = true;
    txt.className = "q sm"; txt.textContent = "Mengecek username...";
    ov.hidden = false; $("btnLogin").disabled = true;
    setTimeout(function(){ txt.textContent = "Menyiapkan data kamu..."; }, 800);
    setTimeout(function(){
      spin.hidden = true; emo.hidden = false;
      txt.className = "q"; txt.textContent = "Yeay berhasil masuk!";
    }, 1700);
    setTimeout(function(){
      ov.hidden = true; logging = false; $("btnLogin").disabled = false;
      show("vMenu");
    }, 3100);
  }
  function salahDenganEfek(){
    if(logging) return;
    logging = true;
    var ov = $("ov3"), spin = $("spin"), emo = $("lEmo"), txt = $("lText"), err = $("err");
    err.hidden = true;
    spin.hidden = false; emo.hidden = true;
    txt.className = "q sm"; txt.textContent = "Mengecek username...";
    ov.hidden = false; $("btnLogin").disabled = true;
    setTimeout(function(){
      spin.hidden = true; emo.hidden = false; emo.textContent = "🤪";
      txt.className = "q md"; txt.textContent = "Salah Kocak, yang bener ngapa nulisnya";
    }, 1600);
    setTimeout(function(){
      ov.hidden = true; emo.textContent = "🎉";
      logging = false; $("btnLogin").disabled = false;
      err.textContent = "Username tidak ditemukan. Cek lagi, pastikan sama persis seperti yang kamu isi di form. Kalau belum isi form, hubungi guru.";
      err.hidden = false;
      $("kode").focus(); $("kode").select();
    }, 3900);
  }
  function login(){
    if(logging) return;
    var k = normUser($("kode").value);
    var err = $("err");
    if(!k){ err.textContent = "Isi username dulu."; err.hidden = false; return; }
    var s = Object.prototype.hasOwnProperty.call(USERNAMES, k) ? DB[norm(USERNAMES[k])] : null;
    if(!s){ salahDenganEfek(); return; }
    err.hidden = true;
    current = s;
    $("nm").textContent = s.nama; $("kd").textContent = s.kelas;
    $("nm2").textContent = s.nama; $("kd2").textContent = s.kelas;
    Array.prototype.forEach.call(document.querySelectorAll(".mapel"), function(b){
      b.hidden = (b.getAttribute("data-tk") !== s.tingkat);
    });
    bukaDenganEfek();
  }

  function keterangan(n){
    if(n < 70) return { cls: "s-bad", text: "Remed loh yahh" };
    if(n <= 75) return { cls: "s-mid", text: "Remed gak yah?" };
    return { cls: "s-good", text: "CONGRATSS!!" };
  }

  function tampil(key){
    var n = current[key];
    var wrap = $("scoreWrap");
    $("mpName").textContent = "Nilai UTS " + MAPEL[key];
    wrap.className = "score-wrap pop";
    if(n === null){
      wrap.classList.add("s-none");
      $("score").textContent = "Belum ada";
      $("msg").textContent = "Nilai belum diinput guru";
    } else {
      var r = keterangan(n);
      wrap.classList.add(r.cls);
      $("score").textContent = (n % 1 === 0) ? String(n) : n.toFixed(1);
      $("msg").textContent = r.text;
    }
    show("vHasil");
    // restart animation
    void wrap.offsetWidth;
  }


  function keluar(){
    current = null;
    batalSekuens(); $("ov").hidden = true; pending = null;
    $("kode").value = "";
    $("err").hidden = true;
    show("vLogin");
    $("kode").focus();
  }


  var STEPS = [
    { emo: "🤔", q: "Beneran mau liat?", yes: "Iya" },
    { emo: "🥺", q: "Ih sumpah?", yes: "Sumpah" },
    { emo: "🧐", q: "Jujur?", yes: "Jujur" },
    { emo: "😬", q: "Suwer?", yes: "Suwer" },
    { emo: "🫣", q: "Beneran?", yes: "Beneran" }
  ];
  var pending = null, step = 0, lastFocus = null;

  function renderStep(){
    var s = STEPS[step];
    $("cemo").textContent = s.emo;
    $("cq").textContent = s.q;
    $("cmp").textContent = "Nilai UTS " + MAPEL[pending] + " (" + (step + 1) + "/" + STEPS.length + ")";
    $("cYes").textContent = s.yes;
    var d = "";
    for(var i=0;i<STEPS.length;i++) d += '<i class="' + (i <= step ? "on" : "") + '"></i>';
    $("cdots").innerHTML = d;
    var dlg = $("dlg"); dlg.classList.remove("shake"); void dlg.offsetWidth; dlg.classList.add("shake");
    $("cYes").focus();
  }
  function mulaiKonfirmasi(key){
    pending = key; step = 0; lastFocus = document.activeElement;
    $("ov").hidden = false;
    renderStep();
  }
  function tutupKonfirmasi(){
    $("ov").hidden = true; pending = null;
    if(lastFocus && lastFocus.focus) lastFocus.focus();
  }

  var seqTimers = [];
  function batalSekuens(){
    seqTimers.forEach(clearTimeout); seqTimers = [];
    $("ov2").hidden = true;
  }
  function sekuens(k){
    batalSekuens();
    var ov = $("ov2"), txt = $("fText"), cnt = $("fCount");
    $("fEmo").textContent = "😒";
    txt.className = "q";
    txt.textContent = "dih gituu, yauda nihh lahh, malass";
    cnt.hidden = true;
    ov.hidden = false;
    // 1) notif "dih gituu..." 2.2 dtk -> 2) PRANK 3 dtk -> 3) hitung mundur 3-2-1 -> nilai
    seqTimers.push(setTimeout(function(){
      $("fEmo").textContent = "🤡";
      txt.className = "q prank";
      txt.textContent = "PRANK";
      seqTimers.push(setTimeout(function(){
        $("fEmo").textContent = "⏳";
        txt.className = "q";
        txt.textContent = "Nilainya keluar dalam...";
        cnt.hidden = false;
        var n = 3;
        (function tick(){
          cnt.textContent = n;
          cnt.classList.remove("tick"); void cnt.offsetWidth; cnt.classList.add("tick");
          if(n === 1){ return; }
          n--;
          seqTimers.push(setTimeout(tick, 900));
        })();
        // setelah 3,2,1 selesai (3 tick + jeda), buka nilai
        seqTimers.push(setTimeout(function(){ batalSekuens(); tampil(k); }, 900 * 3));
      }, 3000));
    }, 2200));
  }


  $("cYes").addEventListener("click", function(){
    if(step < STEPS.length - 1){ step++; renderStep(); return; }
    var k = pending;
    $("ov").hidden = true; pending = null;
    sekuens(k);
  });
  $("cNo").addEventListener("click", tutupKonfirmasi);
  $("ov").addEventListener("click", function(e){ if(e.target === $("ov")) tutupKonfirmasi(); });
  document.addEventListener("keydown", function(e){ if(e.key === "Escape" && !$("ov").hidden) tutupKonfirmasi(); });

  $("btnLogin").addEventListener("click", login);
  $("kode").addEventListener("keydown", function(e){ if(e.key === "Enter") login(); });
  function tanyaKeluar(){ $("ov4").hidden = false; $("oNo").focus(); }
  $("btnKeluar1").addEventListener("click", tanyaKeluar);
  $("btnKeluar2").addEventListener("click", tanyaKeluar);
  $("oNo").addEventListener("click", function(){ $("ov4").hidden = true; });
  $("oYes").addEventListener("click", function(){ $("ov4").hidden = true; keluar(); });
  document.addEventListener("keydown", function(e){ if(e.key === "Escape" && !$("ov4").hidden) $("ov4").hidden = true; });
  $("btnBack").addEventListener("click", function(){ show("vMenu"); });
  Array.prototype.forEach.call(document.querySelectorAll(".mapel"), function(b){
    b.addEventListener("click", function(){ mulaiKonfirmasi(b.getAttribute("data-key")); });
  });
})();
</script>
</body>
</html>
